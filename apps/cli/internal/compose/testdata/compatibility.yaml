services:
  probe:
    image: "ghcr.io/sakurs2/cocola-redis:7.4.10-alpine3.21@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2"
    configs:
      - source: compatibility-marker
        target: /run/cocola-compatibility
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        ["CMD-SHELL", "grep -qx cocola /run/cocola-compatibility && redis-cli ping | grep -q PONG"]
      interval: 1s
      timeout: 3s
      retries: 30

configs:
  compatibility-marker:
    content: cocola
