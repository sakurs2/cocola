services:
  redis:
    image: "${COCOLA_REDIS_IMAGE}"
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: "${COCOLA_POSTGRES_IMAGE}"
    restart: unless-stopped
    environment:
      POSTGRES_USER: cocola
      POSTGRES_PASSWORD: "${COCOLA_PG_PASSWORD}"
      POSTGRES_DB: cocola
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc 'SELECT 1' >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  forgejo-db-init:
    image: "${COCOLA_POSTGRES_IMAGE}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: "${COCOLA_PG_PASSWORD}"
      FORGEJO_DB_PASSWORD: "${COCOLA_FORGEJO_DB_PASSWORD}"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        psql -h postgres -U cocola -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='forgejo'" | grep -q 1 || psql -h postgres -U cocola -d postgres -c "CREATE USER forgejo"
        printf '%s\n' "ALTER USER forgejo WITH PASSWORD :'forgejo_password';" | psql -h postgres -U cocola -d postgres -v forgejo_password="$$FORGEJO_DB_PASSWORD"
        psql -h postgres -U cocola -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='forgejo'" | grep -q 1 || psql -h postgres -U cocola -d postgres -c "CREATE DATABASE forgejo OWNER forgejo"

  forgejo:
    image: "${COCOLA_FORGEJO_IMAGE}"
    restart: unless-stopped
    depends_on:
      forgejo-db-init:
        condition: service_completed_successfully
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      DISABLE_SSH: "true"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: "${COCOLA_FORGEJO_DB_PASSWORD}"
      FORGEJO__server__ROOT_URL: "http://host.docker.internal:${COCOLA_FORGEJO_HOST_PORT}/"
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__actions__ENABLED: "false"
      FORGEJO__repository__DEFAULT_BRANCH: main
      FORGEJO__repository__ENABLE_PUSH_CREATE_USER: "false"
      FORGEJO__repository__ENABLE_PUSH_CREATE_ORG: "false"
      FORGEJO__security__INSTALL_LOCK: "true"
    ports:
      - "127.0.0.1:${COCOLA_FORGEJO_HOST_PORT}:3000"
    volumes:
      - forgejodata:/data
    networks:
      default:
      sandbox-services:
        aliases: [forgejo]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  forgejo-init:
    image: "${COCOLA_FORGEJO_IMAGE}"
    user: "1000:1000"
    depends_on:
      forgejo:
        condition: service_healthy
    environment:
      FORGEJO_WORK_DIR: /data/gitea
      FORGEJO_CUSTOM: /data/gitea
      COCOLA_FORGEJO_PASSWORD: "${COCOLA_FORGEJO_PASSWORD}"
    volumes:
      - forgejodata:/data
    entrypoint:
      - /bin/sh
      - -ec
      - |
        forgejo admin user list --config /data/gitea/conf/app.ini | grep -q ' cocola ' || forgejo admin user create --config /data/gitea/conf/app.ini --username cocola --password "$$COCOLA_FORGEJO_PASSWORD" --email cocola@localhost --admin --must-change-password=false
        forgejo admin user change-password --config /data/gitea/conf/app.ini --username cocola --password "$$COCOLA_FORGEJO_PASSWORD" --must-change-password=false

  minio:
    image: "${COCOLA_MINIO_IMAGE}"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cocola
      MINIO_ROOT_PASSWORD: "${COCOLA_MINIO_ROOT_PASSWORD}"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: "${COCOLA_MINIO_MC_IMAGE}"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      sh -c "mc alias set -- local http://minio:9000 cocola '${COCOLA_MINIO_ROOT_PASSWORD}'
      && mc mb --ignore-existing local/cocola
      && (mc rm --recursive --force local/cocola/openviking/ || true)
      && (mc rm --recursive --force local/cocola/openviking-v2/ || true)
      && (mc rm --recursive --force local/cocola/openviking-v3/ || true)"

  openviking:
    image: "${COCOLA_OPENVIKING_IMAGE}"
    restart: unless-stopped
    # OpenViking readiness depends on an administrator-configured embedding
    # route. Keep deployment liveness separate so a fresh Cocola installation
    # can start before a model is configured, without relying on Compose's
    # version-specific handling of a disabled image healthcheck.
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 5s
      timeout: 3s
      retries: 20
    entrypoint: ["python", "-c"]
    command:
      - |
        import json, os, time, urllib.request
        delay = 2
        while True:
            try:
                request = urllib.request.Request(os.environ["COCOLA_MEMORY_BOOTSTRAP_URL"], headers={"Authorization": "Bearer " + os.environ["COCOLA_MEMORY_LLM_SERVICE_TOKEN"]})
                with urllib.request.urlopen(request, timeout=5) as response:
                    if response.status == 200 and json.load(response).get("embedding_configured"):
                        break
            except Exception:
                pass
            time.sleep(delay)
            delay = min(delay * 2, 15)
        os.execv("/usr/local/bin/openviking-entrypoint", ["openviking-entrypoint", "--without-bot"])
    depends_on:
      llm-gateway:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      OPENVIKING_WITH_BOT: "0"
      COCOLA_MEMORY_BOOTSTRAP_URL: "http://llm-gateway:8080/internal/memory/v1/status"
      COCOLA_MEMORY_LLM_SERVICE_TOKEN: "${COCOLA_MEMORY_LLM_SERVICE_TOKEN}"
      OPENVIKING_CONF_CONTENT: >-
        {"memory":{"version":"v2"},"storage":{"workspace":"/app/.openviking/data","vectordb":{"name":"context","backend":"local","dimension":${COCOLA_MEMORY_EMBEDDING_DIMENSION}},"agfs":{"backend":"s3","s3":{"bucket":"cocola","prefix":"openviking-memory-v2/","endpoint":"http://minio:9000","region":"us-east-1","access_key":"cocola","secret_key":"${COCOLA_MINIO_ROOT_PASSWORD}","use_ssl":false,"use_path_style":true}}},"embedding":{"dense":{"provider":"openai","api_base":"http://llm-gateway:8080/internal/memory/v1","api_key":"${COCOLA_MEMORY_LLM_SERVICE_TOKEN}","model":"cocola-memory-embedding","dimension":${COCOLA_MEMORY_EMBEDDING_DIMENSION},"encoding_format":"float"}},"vlm":{"provider":"openai","api_base":"http://llm-gateway:8080/internal/memory/v1","api_key":"${COCOLA_MEMORY_LLM_SERVICE_TOKEN}","model":"cocola-memory-extraction"},"server":{"host":"0.0.0.0","port":1933,"auth_mode":"trusted","root_api_key":"${COCOLA_OPENVIKING_ROOT_API_KEY}","profile_enabled":false,"cors_origins":[],"observability":{"metrics":{"enabled":true}}}}
    volumes:
      - openvikingdata_memory_v2:/app/.openviking/data

  opensandbox-server:
    profiles: ["managed"]
    image: "${COCOLA_OPENSANDBOX_IMAGE}"
    restart: unless-stopped
    volumes:
      - "${COCOLA_DOCKER_SOCKET_SOURCE:-/var/run/docker.sock}:/var/run/docker.sock"
      - "${COCOLA_SANDBOX_ROOT}:${COCOLA_SANDBOX_ROOT}"
    configs:
      - source: opensandbox-config
        target: /etc/opensandbox/config.toml
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      OPENSANDBOX_INSECURE_SERVER: "YES"
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://localhost:8090/health'').status==200 else 1)"',
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  sandbox-manager:
    image: "${COCOLA_IMAGE_REGISTRY}/cocola-sandbox-manager:${COCOLA_VERSION}"
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      COCOLA_SANDBOX_ADDR: ":50051"
      COCOLA_REDIS_ADDR: redis:6379
      COCOLA_PG_DSN: "postgres://cocola:${COCOLA_PG_PASSWORD}@postgres:5432/cocola?sslmode=disable"
      COCOLA_OPENSANDBOX_URL: "${COCOLA_OPENSANDBOX_URL}"
      COCOLA_OPENSANDBOX_HTTP_TIMEOUT: "240s"
      COCOLA_OPENSANDBOX_EXEC_TIMEOUT: "1h"
      # OpenSandbox creates sibling containers on Docker's built-in bridge,
      # while this control plane runs on the Compose network. Linux isolates
      # those networks, so use the host-mapped endpoint instead
      # of asking the server proxy to dial the sandbox's private bridge IP.
      COCOLA_OPENSANDBOX_DIRECT_EXEC: "1"
      COCOLA_SANDBOX_ROOT: "${COCOLA_SANDBOX_ROOT}"
      COCOLA_SANDBOX_VOLUME_BACKEND: host
      COCOLA_SANDBOX_IDLE_TIMEOUT_MINUTES: "${COCOLA_SANDBOX_IDLE_TIMEOUT_MINUTES:-30}"
      COCOLA_SESSION_VOLUME_SIZE: "${COCOLA_SESSION_VOLUME_SIZE}"
      COCOLA_SANDBOX_IMAGE: "${COCOLA_IMAGE_REGISTRY}/cocola-sandbox-runtime:${COCOLA_VERSION}"
      COCOLA_SANDBOX_PROFILE: "${COCOLA_SANDBOX_PROFILE:-coding}"
      COCOLA_CODE_SERVER_ENABLED: "${COCOLA_CODE_SERVER_ENABLED:-}"
      COCOLA_BROWSER_ENABLED: "${COCOLA_BROWSER_ENABLED:-}"
      COCOLA_SANDBOX_LLM_BASE_URL: "${COCOLA_SANDBOX_LLM_BASE_URL}"
      COCOLA_SANDBOX_MODEL_ALIAS: cocola-default
      COCOLA_PUBLIC_ORIGINS: "${COCOLA_PUBLIC_ORIGINS}"
    volumes:
      - "${COCOLA_SANDBOX_ROOT}:${COCOLA_SANDBOX_ROOT}"
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9092/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  host-agent:
    image: "${COCOLA_IMAGE_REGISTRY}/cocola-storage-probe:${COCOLA_VERSION}"
    restart: unless-stopped
    read_only: true
    environment:
      COCOLA_STORAGE_ROOT: /storage
      COCOLA_NODE_NAME: local
      COCOLA_HOST_AGENT_KEY: "${COCOLA_ADMIN_KEY}"
      COCOLA_COMPOSE_PROJECT: cocola
    volumes:
      - "${COCOLA_DOCKER_SOCKET_SOURCE:-/var/run/docker.sock}:/var/run/docker.sock"
      - "${COCOLA_SANDBOX_ROOT}:/storage"
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/storage-probe", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  llm-gateway:
    image: "${COCOLA_IMAGE_REGISTRY}/cocola-llm-gateway:${COCOLA_VERSION}"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      COCOLA_LLM_HOST: 0.0.0.0
      COCOLA_LLM_PORT: "8080"
      COCOLA_LLM_TIMEOUT_SECS: "${COCOLA_LLM_TIMEOUT_SECS:-600}"
      COCOLA_LLM_REDIS_URL: redis://redis:6379/0
      COCOLA_AUTH_SECRET: "${COCOLA_AUTH_SECRET}"
      COCOLA_AUTH_ISSUER: cocola
      COCOLA_MODEL_SECRET_KEY: "${COCOLA_MODEL_SECRET_KEY}"
      COCOLA_CONFIG_SECRET_KEY: "${COCOLA_CONFIG_SECRET_KEY}"
      COCOLA_MEMORY_LLM_SERVICE_TOKEN: "${COCOLA_MEMORY_LLM_SERVICE_TOKEN}"
      COCOLA_PG_DSN: "postgres://cocola:${COCOLA_PG_PASSWORD}@postgres:5432/cocola?sslmode=disable"
    ports:
      - "${COCOLA_LLM_HOST_PORT}:8080"
    networks:
      default:
      sandbox-services:
        aliases: [llm-gateway]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else sys.exit(1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  admin-api:
    image: "${COCOLA_IMAGE_REGISTRY}/cocola-admin-api:${COCOLA_VERSION}"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      host-agent:
        condition: service_healthy
    environment:
      COCOLA_ADMIN_ADDR: ":8090"
      COCOLA_REDIS_ADDR: redis:6379
      COCOLA_PG_DSN: "postgres://cocola:${COCOLA_PG_PASSWORD}@postgres:5432/cocola?sslmode=disable"
      COCOLA_ADMIN_KEY: "${COCOLA_ADMIN_KEY}"
      COCOLA_AUTH_SECRET: "${COCOLA_AUTH_SECRET}"
      COCOLA_AGENT_ADDR: agent-runtime:50061
      COCOLA_SANDBOX_ADDR: sandbox-manager:50051
      COCOLA_CLUSTER_MANAGER_MODE: compose
      COCOLA_HOST_AGENT_URL: http://host-agent:8095
      COCOLA_HOST_AGENT_KEY: "${COCOLA_ADMIN_KEY}"
      COCOLA_NODE_NAME: local
      COCOLA_OPENSANDBOX_URL: "${COCOLA_OPENSANDBOX_URL}"
      COCOLA_GATEWAY_URL: http://gateway:8080
      COCOLA_LLM_GATEWAY_URL: http://llm-gateway:8080
      COCOLA_FORGEJO_API_URL: "${COCOLA_FORGEJO_API_URL}"
      COCOLA_FORGEJO_VERSION: "16.0.1"
      COCOLA_MODEL_SECRET_KEY: "${COCOLA_MODEL_SECRET_KEY}"
      COCOLA_CONFIG_SECRET_KEY: "${COCOLA_CONFIG_SECRET_KEY}"
      COCOLA_OPENVIKING_URL: "${COCOLA_OPENVIKING_URL}"
      COCOLA_OPENVIKING_ROOT_API_KEY: "${COCOLA_OPENVIKING_ROOT_API_KEY}"
      COCOLA_MEMORY_EMBEDDING_DIMENSION: "${COCOLA_MEMORY_EMBEDDING_DIMENSION}"
      COCOLA_MINIO_ENDPOINT: minio:9000
      COCOLA_MINIO_ACCESS_KEY: cocola
      COCOLA_MINIO_SECRET_KEY: "${COCOLA_MINIO_ROOT_PASSWORD}"
      COCOLA_MINIO_BUCKET: cocola
      COCOLA_SESSION_VOLUME_SIZE: "${COCOLA_SESSION_VOLUME_SIZE}"
      COCOLA_AGENT_MAX_TURNS: "${COCOLA_AGENT_MAX_TURNS:-200}"
      COCOLA_AGENT_TOOL_STEP_TIMEOUT_SECS: "${COCOLA_AGENT_TOOL_STEP_TIMEOUT_SECS:-600}"
      COCOLA_SANDBOX_IDLE_TIMEOUT_MINUTES: "${COCOLA_SANDBOX_IDLE_TIMEOUT_MINUTES:-30}"
      COCOLA_BOOTSTRAP_ADMIN_USERNAME: "${COCOLA_BOOTSTRAP_ADMIN_USERNAME}"
      COCOLA_BOOTSTRAP_ADMIN_EMAIL: "${COCOLA_BOOTSTRAP_ADMIN_EMAIL}"
      COCOLA_BOOTSTRAP_ADMIN_PASSWORD: "${COCOLA_BOOTSTRAP_ADMIN_PASSWORD}"
      COCOLA_BOOTSTRAP_ADMIN_RESET: "${COCOLA_BOOTSTRAP_ADMIN_RESET}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  agent-runtime:
    image: "${COCOLA_IMAGE_REGISTRY}/cocola-agent-runtime:${COCOLA_VERSION}"
    restart: unless-stopped
    depends_on:
      sandbox-manager:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
      admin-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      COCOLA_AGENT_HOST: 0.0.0.0
      COCOLA_AGENT_PORT: "50061"
      COCOLA_SANDBOX_HEARTBEAT_SECS: "20"
      COCOLA_SANDBOX_ADDR: sandbox-manager:50051
      COCOLA_ADMIN_URL: http://admin-api:8090
      COCOLA_ADMIN_KEY: "${COCOLA_ADMIN_KEY}"
      COCOLA_SANDBOX_IMAGE: "${COCOLA_IMAGE_REGISTRY}/cocola-sandbox-runtime:${COCOLA_VERSION}"
      COCOLA_SANDBOX_LLM_BASE_URL: "${COCOLA_SANDBOX_LLM_BASE_URL}"
      COCOLA_SANDBOX_MODEL_ALIAS: cocola-default
      COCOLA_PG_DSN: "postgres://cocola:${COCOLA_PG_PASSWORD}@postgres:5432/cocola?sslmode=disable"
      COCOLA_MINIO_ENDPOINT: minio:9000
      COCOLA_MINIO_ACCESS_KEY: cocola
      COCOLA_MINIO_SECRET_KEY: "${COCOLA_MINIO_ROOT_PASSWORD}"
      COCOLA_MINIO_BUCKET: cocola
      COCOLA_SANDBOX_PROJECT_BROKER_URL: "${COCOLA_SANDBOX_PROJECT_BROKER_URL}"
      COCOLA_SANDBOX_SKILL_BROKER_URL: "${COCOLA_SANDBOX_SKILL_BROKER_URL}"
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 50061), 2).close()",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway:
    image: "${COCOLA_IMAGE_REGISTRY}/cocola-gateway:${COCOLA_VERSION}"
    restart: unless-stopped
    depends_on:
      sandbox-manager:
        condition: service_healthy
      agent-runtime:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      forgejo-init:
        condition: service_completed_successfully
    environment:
      COCOLA_GATEWAY_ADDR: ":8080"
      COCOLA_AGENT_ADDR: agent-runtime:50061
      COCOLA_AGENT_MAX_TURNS: "${COCOLA_AGENT_MAX_TURNS:-200}"
      COCOLA_AGENT_TOOL_STEP_TIMEOUT_SECS: "${COCOLA_AGENT_TOOL_STEP_TIMEOUT_SECS:-600}"
      COCOLA_SANDBOX_TOKEN_TTL_SECONDS: "${COCOLA_SANDBOX_TOKEN_TTL_SECONDS:-604800}"
      COCOLA_SANDBOX_ADDR: sandbox-manager:50051
      COCOLA_AUTH_SECRET: "${COCOLA_AUTH_SECRET}"
      COCOLA_ADMIN_URL: "http://admin-api:8090"
      COCOLA_PG_DSN: "postgres://cocola:${COCOLA_PG_PASSWORD}@postgres:5432/cocola?sslmode=disable"
      COCOLA_MINIO_ENDPOINT: minio:9000
      COCOLA_MINIO_ACCESS_KEY: cocola
      COCOLA_MINIO_SECRET_KEY: "${COCOLA_MINIO_ROOT_PASSWORD}"
      COCOLA_MINIO_BUCKET: cocola
      COCOLA_OPENVIKING_URL: "${COCOLA_OPENVIKING_URL}"
      COCOLA_OPENVIKING_ROOT_API_KEY: "${COCOLA_OPENVIKING_ROOT_API_KEY}"
      COCOLA_MEMORY_EMBEDDING_DIMENSION: "${COCOLA_MEMORY_EMBEDDING_DIMENSION}"
      COCOLA_SCM_SECRET_KEY: "${COCOLA_SCM_SECRET_KEY}"
      COCOLA_SCM_SECRET_KEY_FILE: "${COCOLA_SCM_SECRET_KEY_FILE:-}"
      COCOLA_PUBLIC_ORIGINS: "${COCOLA_PUBLIC_ORIGINS}"
      COCOLA_PROJECT_MAX_REPOSITORY_MB: "${COCOLA_PROJECT_MAX_REPOSITORY_MB:-512}"
      COCOLA_FEATURE_LOCAL_PROJECTS: "${COCOLA_FEATURE_LOCAL_PROJECTS:-true}"
      COCOLA_FEATURE_GITHUB_MANIFEST_CONNECTOR: "${COCOLA_FEATURE_GITHUB_MANIFEST_CONNECTOR:-true}"
      COCOLA_FEATURE_GITHUB_AGENT_WRITE: "${COCOLA_FEATURE_GITHUB_AGENT_WRITE:-true}"
      COCOLA_FORGEJO_API_URL: "${COCOLA_FORGEJO_API_URL}"
      COCOLA_FORGEJO_CLONE_URL: "${COCOLA_FORGEJO_CLONE_URL}"
      COCOLA_FORGEJO_USERNAME: cocola
      COCOLA_FORGEJO_PASSWORD: "${COCOLA_FORGEJO_PASSWORD}"
      COCOLA_SKILL_PUBLISH_ENABLED: "${COCOLA_SKILL_PUBLISH_ENABLED:-false}"
    volumes:
      - "${COCOLA_HOME}/secrets:/run/secrets:ro"
    networks:
      default:
      sandbox-services:
        aliases: [gateway]
    # Direct OpenSandbox endpoints use the portable host-gateway alias. This
    # covers Preview and Terminal in addition to sandbox-manager Exec calls.
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${COCOLA_GATEWAY_HOST_PORT}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    image: "${COCOLA_IMAGE_REGISTRY}/cocola-web:${COCOLA_VERSION}"
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
      admin-api:
        condition: service_healthy
      host-agent:
        condition: service_healthy
    environment:
      NODE_ENV: production
      COCOLA_WEB_HOST: "${COCOLA_WEB_HOST:-0.0.0.0}"
      NEXT_PUBLIC_GATEWAY_URL: "http://localhost:${COCOLA_GATEWAY_HOST_PORT}"
      COCOLA_GATEWAY_URL: http://gateway:8080
      COCOLA_LLM_GATEWAY_URL: http://llm-gateway:8080
      COCOLA_ADMIN_URL: http://admin-api:8090
      COCOLA_ADMIN_KEY: "${COCOLA_ADMIN_KEY}"
      COCOLA_HOST_AGENT_URL: http://host-agent:8095
      COCOLA_HOST_AGENT_KEY: "${COCOLA_ADMIN_KEY}"
      AUTH_SECRET: "${AUTH_SECRET}"
      COCOLA_PUBLIC_ORIGINS: "${COCOLA_PUBLIC_ORIGINS}"
    ports:
      - "${COCOLA_WEB_HOST_PORT}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/product-config').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

networks:
  default:
  sandbox-services:
    # OpenSandbox creates dynamic containers outside Compose. A stable name lets
    # those containers share only the authenticated services they need without
    # joining Cocola's control-plane network or hairpinning through host ports.
    name: cocola-sandbox-services

configs:
  opensandbox-config:
    content: |
      [server]
      host = "0.0.0.0"
      port = 8090

      [log]
      level = "INFO"

      [runtime]
      type = "docker"
      execd_image = "${COCOLA_OPENSANDBOX_EXECD_IMAGE}"

      [egress]
      image = "${COCOLA_OPENSANDBOX_EGRESS_IMAGE}"

      [storage]
      allowed_host_paths = ["${COCOLA_SANDBOX_ROOT}"]

      [docker]
      network_mode = "cocola-sandbox-services"
      host_ip = "host.docker.internal"
      drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
      no_new_privileges = true
      pids_limit = 4096

      [ingress]
      mode = "direct"

volumes:
  redisdata:
  pgdata:
  miniodata:
  forgejodata:
  openvikingdata_memory_v2:
