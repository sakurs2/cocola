# Local development infrastructure for cocola.
# Intentionally minimal: only local stateful dependencies for dev mode.
#
# Usage:
#   make dev-up      # start everything
#   make dev-down    # stop
#   make dev-logs    # tail logs

name: cocola-dev

services:
  postgres:
    image: ghcr.io/sakurs2/cocola-postgres:16.14-alpine3.23@sha256:42b8b8b29c8a4e933d88943e5b03001a78794905cf786e6e7634e9f2abd5a0d3
    container_name: cocola-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cocola
      POSTGRES_PASSWORD: cocola_dev_pw
      POSTGRES_DB: cocola
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocola -d cocola"]
      interval: 5s
      timeout: 3s
      retries: 10

  forgejo-db-init:
    image: ghcr.io/sakurs2/cocola-postgres:16.14-alpine3.23@sha256:42b8b8b29c8a4e933d88943e5b03001a78794905cf786e6e7634e9f2abd5a0d3
    container_name: cocola-forgejo-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: cocola_dev_pw
      FORGEJO_DB_PASSWORD: cocola_forgejo_dev_pw
    entrypoint:
      - /bin/sh
      - -ec
      - |
        psql -h postgres -U cocola -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='forgejo'" | grep -q 1 || psql -h postgres -U cocola -d postgres -c "CREATE USER forgejo"
        printf '%s\n' "ALTER USER forgejo WITH PASSWORD :'forgejo_password';" | psql -h postgres -U cocola -d postgres -v forgejo_password="$$FORGEJO_DB_PASSWORD"
        psql -h postgres -U cocola -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='forgejo'" | grep -q 1 || psql -h postgres -U cocola -d postgres -c "CREATE DATABASE forgejo OWNER forgejo"

  forgejo:
    image: ghcr.io/sakurs2/cocola-forgejo:16.0.1@sha256:3eb3107bc9de4e9d6d9e539044e6c802dc0b7be351919a145540d4cb5422bf07
    container_name: cocola-forgejo
    restart: unless-stopped
    depends_on:
      forgejo-db-init:
        condition: service_completed_successfully
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      DISABLE_SSH: "true"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: cocola_forgejo_dev_pw
      FORGEJO__server__ROOT_URL: "http://host.docker.internal:${COCOLA_FORGEJO_HOST_PORT:-3001}/"
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__actions__ENABLED: "false"
      FORGEJO__repository__DEFAULT_BRANCH: main
      FORGEJO__repository__ENABLE_PUSH_CREATE_USER: "false"
      FORGEJO__repository__ENABLE_PUSH_CREATE_ORG: "false"
      FORGEJO__security__INSTALL_LOCK: "true"
    ports:
      - "127.0.0.1:${COCOLA_FORGEJO_HOST_PORT:-3001}:3000"
    volumes:
      - forgejodata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  forgejo-init:
    image: ghcr.io/sakurs2/cocola-forgejo:16.0.1@sha256:3eb3107bc9de4e9d6d9e539044e6c802dc0b7be351919a145540d4cb5422bf07
    container_name: cocola-forgejo-init
    user: "1000:1000"
    depends_on:
      forgejo:
        condition: service_healthy
    environment:
      FORGEJO_WORK_DIR: /data/gitea
      FORGEJO_CUSTOM: /data/gitea
      COCOLA_FORGEJO_PASSWORD: cocola_forgejo_admin
    volumes:
      - forgejodata:/data
    entrypoint:
      - /bin/sh
      - -ec
      - |
        forgejo admin user list --config /data/gitea/conf/app.ini | grep -q ' cocola ' || forgejo admin user create --config /data/gitea/conf/app.ini --username cocola --password "$$COCOLA_FORGEJO_PASSWORD" --email cocola@localhost --admin --must-change-password=false
        forgejo admin user change-password --config /data/gitea/conf/app.ini --username cocola --password "$$COCOLA_FORGEJO_PASSWORD" --must-change-password=false

  redis:
    image: ghcr.io/sakurs2/cocola-redis:7.4.10-alpine3.21@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: cocola-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: ghcr.io/sakurs2/cocola-minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: cocola-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cocola
      MINIO_ROOT_PASSWORD: cocola_dev_pw
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO bucket bootstrap — runs once, creates the default bucket.
  minio-init:
    image: ghcr.io/sakurs2/cocola-minio-mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: cocola-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 cocola cocola_dev_pw &&
      mc mb --ignore-existing local/cocola &&
      (mc rm --recursive --force local/cocola/openviking/ || true) &&
      (mc rm --recursive --force local/cocola/openviking-v2/ || true) &&
      (mc rm --recursive --force local/cocola/openviking-v3/ || true) &&
      mc anonymous set download local/cocola/public || true
      "

  openviking:
    image: ghcr.io/volcengine/openviking:v0.4.12@sha256:0d99361a0029ce5221fd11588d9f0f374c6e5f8f1eacbcf1d76de6a0f6cd82cb
    container_name: cocola-openviking
    restart: unless-stopped
    entrypoint: ["python", "-c"]
    command:
      - |
        import json, os, time, urllib.request
        delay = 2
        while True:
            try:
                request = urllib.request.Request(os.environ["COCOLA_MEMORY_BOOTSTRAP_URL"], headers={"Authorization": "Bearer " + os.environ["COCOLA_MEMORY_LLM_SERVICE_TOKEN"]})
                with urllib.request.urlopen(request, timeout=5) as response:
                    if response.status == 200 and json.load(response).get("embedding_configured"):
                        break
            except Exception:
                pass
            time.sleep(delay)
            delay = min(delay * 2, 15)
        os.execv("/usr/local/bin/openviking-entrypoint", ["openviking-entrypoint", "--without-bot"])
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      OPENVIKING_WITH_BOT: "0"
      COCOLA_MEMORY_BOOTSTRAP_URL: "http://host.docker.internal:${COCOLA_LLM_PORT:-8081}/internal/memory/v1/status"
      COCOLA_MEMORY_LLM_SERVICE_TOKEN: "${COCOLA_MEMORY_LLM_SERVICE_TOKEN:-cocola-local-memory-service-token}"
      OPENVIKING_CONF_CONTENT: >-
        {"memory":{"version":"v2"},"storage":{"workspace":"/app/.openviking/data","vectordb":{"name":"context","backend":"local","dimension":${COCOLA_MEMORY_EMBEDDING_DIMENSION:-1024}},"agfs":{"backend":"s3","s3":{"bucket":"cocola","prefix":"openviking-memory-v2/","endpoint":"http://minio:9000","region":"us-east-1","access_key":"cocola","secret_key":"cocola_dev_pw","use_ssl":false,"use_path_style":true}}},"embedding":{"dense":{"provider":"openai","api_base":"http://host.docker.internal:${COCOLA_LLM_PORT:-8081}/internal/memory/v1","api_key":"${COCOLA_MEMORY_LLM_SERVICE_TOKEN:-cocola-local-memory-service-token}","model":"cocola-memory-embedding","dimension":${COCOLA_MEMORY_EMBEDDING_DIMENSION:-1024},"encoding_format":"float"}},"vlm":{"provider":"openai","api_base":"http://host.docker.internal:${COCOLA_LLM_PORT:-8081}/internal/memory/v1","api_key":"${COCOLA_MEMORY_LLM_SERVICE_TOKEN:-cocola-local-memory-service-token}","model":"cocola-memory-extraction"},"server":{"host":"0.0.0.0","port":1933,"auth_mode":"trusted","root_api_key":"${COCOLA_OPENVIKING_ROOT_API_KEY:-cocola-local-openviking-root-key}","profile_enabled":false,"cors_origins":[],"observability":{"metrics":{"enabled":true}}}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:1933:1933"
    volumes:
      - openvikingdata_memory_v2:/app/.openviking/data

volumes:
  pgdata:
  redisdata:
  miniodata:
  forgejodata:
  openvikingdata_memory_v2:
