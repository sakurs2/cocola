# Local development infrastructure for cocola.
# Intentionally minimal: only local stateful dependencies for dev mode.
#
# Usage:
#   make dev-up      # start everything
#   make dev-down    # stop
#   make dev-logs    # tail logs

name: cocola-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: cocola-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cocola
      POSTGRES_PASSWORD: cocola_dev_pw
      POSTGRES_DB: cocola
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocola -d cocola"]
      interval: 5s
      timeout: 3s
      retries: 10

  forgejo-db-init:
    image: postgres:16-alpine
    container_name: cocola-forgejo-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: cocola_dev_pw
      FORGEJO_DB_PASSWORD: cocola_forgejo_dev_pw
    entrypoint:
      - /bin/sh
      - -ec
      - |
        psql -h postgres -U cocola -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='forgejo'" | grep -q 1 || psql -h postgres -U cocola -d postgres -c "CREATE USER forgejo"
        printf '%s\n' "ALTER USER forgejo WITH PASSWORD :'forgejo_password';" | psql -h postgres -U cocola -d postgres -v forgejo_password="$$FORGEJO_DB_PASSWORD"
        psql -h postgres -U cocola -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='forgejo'" | grep -q 1 || psql -h postgres -U cocola -d postgres -c "CREATE DATABASE forgejo OWNER forgejo"

  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.1
    container_name: cocola-forgejo
    restart: unless-stopped
    depends_on:
      forgejo-db-init:
        condition: service_completed_successfully
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      DISABLE_SSH: "true"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: cocola_forgejo_dev_pw
      FORGEJO__server__ROOT_URL: http://127.0.0.1:3001/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__actions__ENABLED: "false"
      FORGEJO__repository__DEFAULT_BRANCH: main
      FORGEJO__repository__ENABLE_PUSH_CREATE_USER: "false"
      FORGEJO__repository__ENABLE_PUSH_CREATE_ORG: "false"
      FORGEJO__security__INSTALL_LOCK: "true"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - forgejodata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  forgejo-init:
    image: codeberg.org/forgejo/forgejo:16.0.1
    container_name: cocola-forgejo-init
    user: "1000:1000"
    depends_on:
      forgejo:
        condition: service_healthy
    environment:
      FORGEJO_WORK_DIR: /data/gitea
      FORGEJO_CUSTOM: /data/gitea
      COCOLA_FORGEJO_PASSWORD: cocola_forgejo_admin
    volumes:
      - forgejodata:/data
    entrypoint:
      - /bin/sh
      - -ec
      - |
        forgejo admin user list --config /data/gitea/conf/app.ini | grep -q ' cocola ' || forgejo admin user create --config /data/gitea/conf/app.ini --username cocola --password "$$COCOLA_FORGEJO_PASSWORD" --email cocola@localhost --admin --must-change-password=false
        forgejo admin user change-password --config /data/gitea/conf/app.ini --username cocola --password "$$COCOLA_FORGEJO_PASSWORD" --must-change-password=false

  redis:
    image: redis:7-alpine
    container_name: cocola-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: cocola-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cocola
      MINIO_ROOT_PASSWORD: cocola_dev_pw
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO bucket bootstrap — runs once, creates the default bucket.
  minio-init:
    image: minio/mc:latest
    container_name: cocola-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 cocola cocola_dev_pw &&
      mc mb --ignore-existing local/cocola &&
      mc anonymous set download local/cocola/public || true
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
  forgejodata:
