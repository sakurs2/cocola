name: Feature request
description: Propose an improvement based on a concrete user problem
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation are you experiencing?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should users be able to accomplish?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Possible approach
      description: Optional. A solution is welcome, but the user problem matters most.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe workarounds or related tools you tried.
