version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /deploy/sandbox-runtime
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      sandbox-runtime-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directories:
      - /apps/admin-api
      - /apps/cli
      - /apps/gateway
      - /apps/sandbox-manager
      - /db
      - /packages/go-common
      - /packages/proto/gen/go
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directories:
      - /apps/agent-runtime
      - /apps/llm-gateway
      - /packages/py-common
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
