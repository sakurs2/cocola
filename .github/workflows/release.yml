name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  ci:
    name: release checks
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  validate:
    name: validate release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Require the release commit to be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" "origin/${DEFAULT_BRANCH}"; then
            echo "release tag ${RELEASE_TAG} is not on ${DEFAULT_BRANCH}" >&2
            exit 1
          fi
      - name: Validate semantic version and ordering
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: git tag --list 'v*' | python3 scripts/validate_release_version.py "$RELEASE_TAG"
      - name: Reject an already published release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setFailed(`release ${tag} already exists`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }

  images:
    name: image / ${{ matrix.name }}
    needs: [ci, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            dockerfile: apps/gateway/Dockerfile
            context: .
          - name: admin-api
            dockerfile: apps/admin-api/Dockerfile
            context: .
          - name: storage-probe
            dockerfile: apps/admin-api/storage-probe.Dockerfile
            context: .
          - name: agent-runtime
            dockerfile: apps/agent-runtime/Dockerfile
            context: .
          - name: llm-gateway
            dockerfile: apps/llm-gateway/Dockerfile
            context: .
          - name: sandbox-manager
            dockerfile: apps/sandbox-manager/Dockerfile
            context: .
          - name: web
            dockerfile: apps/web/Dockerfile
            context: .
          - name: sandbox-runtime
            dockerfile: deploy/sandbox-runtime/Dockerfile
            context: deploy/sandbox-runtime
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/cocola-${{ matrix.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Detect an unchanged sandbox runtime
        id: sandbox_runtime
        if: matrix.name == 'sandbox-runtime'
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cocola-sandbox-runtime
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          reuse=false
          previous_tag="$(git describe --tags --match 'v*' --abbrev=0 "${RELEASE_TAG}^{commit}^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]] && \
             git diff --quiet "${previous_tag}^{commit}" "${RELEASE_TAG}^{commit}" -- deploy/sandbox-runtime && \
             docker buildx imagetools inspect "${IMAGE_NAME}:${previous_tag}" >/dev/null 2>&1; then
            reuse=true
            echo "Sandbox runtime is unchanged since ${previous_tag}; reusing its image digest."
            echo "source=${IMAGE_NAME}:${previous_tag}" >> "$GITHUB_OUTPUT"
          else
            echo "Sandbox runtime changed or no reusable release image exists; building it."
          fi
          echo "reuse=${reuse}" >> "$GITHUB_OUTPUT"
      - name: Reuse unchanged sandbox runtime
        if: matrix.name == 'sandbox-runtime' && steps.sandbox_runtime.outputs.reuse == 'true'
        env:
          SOURCE_IMAGE: ${{ steps.sandbox_runtime.outputs.source }}
          TARGET_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags <<< "$TARGET_TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            if [[ -n "$tag" ]]; then
              tag_args+=(--tag "$tag")
            fi
          done
          docker buildx imagetools create "${tag_args[@]}" "$SOURCE_IMAGE"
      - id: build
        if: matrix.name != 'sandbox-runtime' || steps.sandbox_runtime.outputs.reuse != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          sbom: true
          provenance: mode=max
      - name: Verify anonymous image access
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cocola-${{ matrix.name }}:${{ github.ref_name }}
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          for attempt in {1..12}; do
            if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
              echo "Verified anonymous pull access for $IMAGE"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Published image is not anonymously readable: $IMAGE. Set the GHCR package visibility to Public, then rerun the failed jobs."
          exit 1
      - name: Verify sandbox runtime
        if: matrix.name == 'sandbox-runtime'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cocola-sandbox-runtime:${{ github.ref_name }}
        run: |
          output="$(docker run --rm --platform linux/amd64 "$IMAGE" /opt/cocola/shim/entrypoint.sh --selfcheck)"
          echo "$output"
          SELF="$output" python3 - <<'PY'
          import json
          import os

          data = json.loads(os.environ["SELF"])
          required = ["node", "claude_cli", "claude_agent_sdk", "chromium", "make", "gh"]
          failed = [name for name in required if str(data.get(name, "")).startswith(("missing", "error:"))]
          if failed:
              raise SystemExit("sandbox runtime selfcheck failed: " + ", ".join(failed))
          if data.get("github_skill") is not True:
              raise SystemExit("sandbox runtime selfcheck failed: Cocola GitHub Skill is missing")
          PY

  cli:
    name: cli binaries
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache-dependency-path: apps/cli/go.sum
      - name: Test CLI
        working-directory: apps/cli
        run: go test ./...
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
