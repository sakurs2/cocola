name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  ci:
    name: release checks
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  validate:
    name: validate release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Require the release commit to be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" "origin/${DEFAULT_BRANCH}"; then
            echo "release tag ${RELEASE_TAG} is not on ${DEFAULT_BRANCH}" >&2
            exit 1
          fi
      - name: Validate semantic version and ordering
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: git tag --list 'v*' | python3 scripts/validate_release_version.py "$RELEASE_TAG"
      - name: Reject an already published release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setFailed(`release ${tag} already exists`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }

  forgejo-image:
    name: mirror Forgejo image and source
    needs: [ci, validate]
    runs-on: ubuntu-latest
    concurrency:
      group: forgejo-distribution-16.0.1
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      FORGEJO_VERSION: 16.0.1
      FORGEJO_COMMIT: b3d7e4ac3cbccc220703097a51fa4c16bf302579
      FORGEJO_MANIFEST_DIGEST: sha256:3eb3107bc9de4e9d6d9e539044e6c802dc0b7be351919a145540d4cb5422bf07
      FORGEJO_SOURCE_SHA256: 727e46ee360f00679d66fb12aaf935513109e6988c5834394a1ccf2931bb8db7
      FORGEJO_SOURCE_RELEASE_TAG: forgejo-source-v16.0.1
      SOURCE_IMAGE: codeberg.org/forgejo/forgejo:16.0.1
      TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/cocola-forgejo:16.0.1
    steps:
      - uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0
        with:
          release: v0.9.2
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and mirror the immutable upstream image
        run: |
          set -euo pipefail
          source_digest="$(regctl image digest "$SOURCE_IMAGE")"
          if [[ "$source_digest" != "$FORGEJO_MANIFEST_DIGEST" ]]; then
            echo "::error::Forgejo upstream digest changed: expected $FORGEJO_MANIFEST_DIGEST, got $source_digest"
            exit 1
          fi
          if target_digest="$(regctl image digest "$TARGET_IMAGE" 2>/dev/null)"; then
            if [[ "$target_digest" != "$FORGEJO_MANIFEST_DIGEST" ]]; then
              echo "::error::Refusing to overwrite $TARGET_IMAGE at unexpected digest $target_digest"
              exit 1
            fi
            echo "Forgejo mirror already exists at the expected digest."
          else
            regctl image copy --force-recursive \
              "$SOURCE_IMAGE@$FORGEJO_MANIFEST_DIGEST" "$TARGET_IMAGE"
          fi
          target_digest="$(regctl image digest "$TARGET_IMAGE")"
          if [[ "$target_digest" != "$FORGEJO_MANIFEST_DIGEST" ]]; then
            echo "::error::Mirrored Forgejo digest mismatch: $target_digest"
            exit 1
          fi
          regctl manifest get "$TARGET_IMAGE" --format raw-body > /tmp/forgejo-manifest.json
          jq -e '[.manifests[].platform | (.os + "/" + .architecture)] | index("linux/amd64") != null and index("linux/arm64") != null' /tmp/forgejo-manifest.json
      - name: Verify anonymous mirror access
        run: |
          set -euo pipefail
          regctl registry logout ghcr.io || true
          for attempt in {1..12}; do
            if [[ "$(regctl image digest "$TARGET_IMAGE" 2>/dev/null || true)" == "$FORGEJO_MANIFEST_DIGEST" ]]; then
              echo "Verified anonymous pull access for $TARGET_IMAGE"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$TARGET_IMAGE is not anonymously readable. Mark the GHCR package Public, then rerun the failed workflow."
          exit 1
      - name: Ensure the corresponding Forgejo source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/forgejo-source-${FORGEJO_VERSION}"
          archive_name="forgejo-${FORGEJO_VERSION}-source.tar.gz"
          provenance_name="forgejo-${FORGEJO_VERSION}-source.txt"
          archive="${source_dir}/${archive_name}"
          provenance="${source_dir}/${provenance_name}"
          notes="${source_dir}/release-notes.md"
          release_title="Forgejo ${FORGEJO_VERSION} corresponding source"
          expected_archive_digest="sha256:${FORGEJO_SOURCE_SHA256}"
          mkdir -p "$source_dir"

          {
            echo "Forgejo ${FORGEJO_VERSION} complete corresponding source"
            echo "Upstream: https://codeberg.org/forgejo/forgejo"
            echo "Tag: v${FORGEJO_VERSION}"
            echo "Commit: ${FORGEJO_COMMIT}"
            echo "License: GPL-3.0-or-later (included in the source archive)"
            echo "Distributed image: ${TARGET_IMAGE}@${FORGEJO_MANIFEST_DIGEST}"
            echo "Source SHA-256: ${FORGEJO_SOURCE_SHA256}"
          } > "$provenance"
          expected_provenance_digest="sha256:$(sha256sum "$provenance" | cut -d' ' -f1)"

          cat > "$notes" <<EOF
          This release stores the complete corresponding source for the unmodified
          Forgejo ${FORGEJO_VERSION} container image redistributed by Cocola. It is a
          third-party source archive, not a Cocola application release, and must not be
          marked as the latest Cocola release.

          - Upstream: https://codeberg.org/forgejo/forgejo
          - Tag: v${FORGEJO_VERSION}
          - Commit: ${FORGEJO_COMMIT}
          - License: GPL-3.0-or-later
          - Mirrored image: ${TARGET_IMAGE}@${FORGEJO_MANIFEST_DIGEST}
          - Source SHA-256: ${FORGEJO_SOURCE_SHA256}
          EOF

          get_release() {
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq -c --arg tag "$FORGEJO_SOURCE_RELEASE_TAG" \
                '[.[][] | select(.tag_name == $tag)] | if length == 0 then empty elif length == 1 then .[0] else error("duplicate source releases") end'
          }

          verify_asset() {
            local release_json="$1" name="$2" expected_digest="$3"
            local matches state digest
            matches="$(jq -r --arg name "$name" '[.assets[] | select(.name == $name)] | length' <<< "$release_json")"
            if [[ "$matches" == "0" ]]; then
              return 1
            fi
            if [[ "$matches" != "1" ]]; then
              echo "::error::Forgejo source release has duplicate ${name} assets"
              exit 1
            fi
            state="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .state' <<< "$release_json")"
            digest="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<< "$release_json")"
            if [[ "$state" != "uploaded" || "$digest" != "$expected_digest" ]]; then
              echo "::error::Refusing to replace ${name}: expected ${expected_digest}, got state=${state} digest=${digest}"
              exit 1
            fi
          }

          release_json="$(get_release)"
          if [[ -z "$release_json" ]]; then
            gh release create "$FORGEJO_SOURCE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft \
              --latest=false \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes-file "$notes"
            release_json="$(get_release)"
          fi
          actual_title="$(jq -r '.name // ""' <<< "$release_json")"
          actual_body="$(jq -r '.body // ""' <<< "$release_json")"
          if [[ "$actual_title" != "$release_title" ]]; then
            echo "::error::Forgejo source release title does not match the pinned distribution"
            exit 1
          fi
          required_body_values=(
            "https://codeberg.org/forgejo/forgejo"
            "v${FORGEJO_VERSION}"
            "$FORGEJO_COMMIT"
            "GPL-3.0-or-later"
            "${TARGET_IMAGE}@${FORGEJO_MANIFEST_DIGEST}"
            "$FORGEJO_SOURCE_SHA256"
          )
          for required_value in "${required_body_values[@]}"; do
            if [[ "$actual_body" != *"$required_value"* ]]; then
              echo "::error::Forgejo source release body is missing pinned value: ${required_value}"
              exit 1
            fi
          done
          if [[ "$(jq -r '.prerelease' <<< "$release_json")" != "false" ]]; then
            echo "::error::Forgejo source archive must not be a prerelease"
            exit 1
          fi

          if ! verify_asset "$release_json" "$archive_name" "$expected_archive_digest"; then
            observed_commit="$(git ls-remote https://code.forgejo.org/forgejo/forgejo.git "refs/tags/v${FORGEJO_VERSION}")"
            observed_commit="${observed_commit%%[[:space:]]*}"
            if [[ "$observed_commit" != "$FORGEJO_COMMIT" ]]; then
              echo "::error::Forgejo tag commit changed: expected $FORGEJO_COMMIT, got $observed_commit"
              exit 1
            fi
            curl --fail --location --retry 3 \
              "https://code.forgejo.org/forgejo/forgejo/archive/v${FORGEJO_VERSION}.tar.gz" \
              --output "$archive"
            echo "${FORGEJO_SOURCE_SHA256}  ${archive}" | sha256sum --check --strict
            tar -tzf "$archive" > "${source_dir}/archive-files.txt"
            grep -Eq '/(LICENSE|COPYING)$' "${source_dir}/archive-files.txt"
            gh release upload "$FORGEJO_SOURCE_RELEASE_TAG" "$archive" --repo "$GITHUB_REPOSITORY"
            release_json="$(get_release)"
            verify_asset "$release_json" "$archive_name" "$expected_archive_digest"
          fi

          if ! verify_asset "$release_json" "$provenance_name" "$expected_provenance_digest"; then
            gh release upload "$FORGEJO_SOURCE_RELEASE_TAG" "$provenance" --repo "$GITHUB_REPOSITORY"
            release_json="$(get_release)"
            verify_asset "$release_json" "$provenance_name" "$expected_provenance_digest"
          fi

          if [[ "$(jq -r '.draft' <<< "$release_json")" == "true" ]]; then
            gh release edit "$FORGEJO_SOURCE_RELEASE_TAG" --draft=false --latest=false --repo "$GITHUB_REPOSITORY"
            release_json="$(get_release)"
          fi
          if [[ "$(jq -r '.draft' <<< "$release_json")" != "false" ]]; then
            echo "::error::Forgejo source archive release is not published"
            exit 1
          fi
          if latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null)"; then
            if [[ "$latest_tag" == "$FORGEJO_SOURCE_RELEASE_TAG" ]]; then
              echo "::error::Forgejo source archive must not replace the latest Cocola release"
              exit 1
            fi
          fi
          archive_url="$(jq -r --arg name "$archive_name" '.assets[] | select(.name == $name) | .browser_download_url' <<< "$release_json")"
          curl --fail --location --head --retry 3 --silent --show-error "$archive_url" >/dev/null
          {
            echo "### Forgejo redistribution"
            echo "Cocola mirrors the unmodified Forgejo ${FORGEJO_VERSION} image at ${FORGEJO_MANIFEST_DIGEST}."
            echo "The complete corresponding source is available at https://github.com/${GITHUB_REPOSITORY}/releases/tag/${FORGEJO_SOURCE_RELEASE_TAG}."
          } >> "$GITHUB_STEP_SUMMARY"

  images:
    name: image / ${{ matrix.name }}
    needs: [ci, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: gateway
            dockerfile: apps/gateway/Dockerfile
            context: .
          - name: admin-api
            dockerfile: apps/admin-api/Dockerfile
            context: .
          - name: storage-probe
            dockerfile: apps/admin-api/storage-probe.Dockerfile
            context: .
          - name: agent-runtime
            dockerfile: apps/agent-runtime/Dockerfile
            context: .
          - name: llm-gateway
            dockerfile: apps/llm-gateway/Dockerfile
            context: .
          - name: sandbox-manager
            dockerfile: apps/sandbox-manager/Dockerfile
            context: .
          - name: web
            dockerfile: apps/web/Dockerfile
            context: .
          - name: sandbox-runtime
            dockerfile: deploy/sandbox-runtime/Dockerfile
            context: deploy/sandbox-runtime
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/cocola-${{ matrix.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
      - name: Detect an unchanged sandbox runtime
        id: sandbox_runtime
        if: matrix.name == 'sandbox-runtime'
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cocola-sandbox-runtime
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          reuse=false
          previous_tag="$(git describe --tags --match 'v*' --abbrev=0 "${RELEASE_TAG}^{commit}^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]] && \
             git diff --quiet "${previous_tag}^{commit}" "${RELEASE_TAG}^{commit}" -- deploy/sandbox-runtime && \
             docker buildx imagetools inspect "${IMAGE_NAME}:${previous_tag}" >/dev/null 2>&1; then
            reuse=true
            echo "Sandbox runtime is unchanged since ${previous_tag}; reusing its image digest."
            echo "source=${IMAGE_NAME}:${previous_tag}" >> "$GITHUB_OUTPUT"
          else
            echo "Sandbox runtime changed or no reusable release image exists; building it."
          fi
          echo "reuse=${reuse}" >> "$GITHUB_OUTPUT"
      - name: Reuse unchanged sandbox runtime
        if: matrix.name == 'sandbox-runtime' && steps.sandbox_runtime.outputs.reuse == 'true'
        env:
          SOURCE_IMAGE: ${{ steps.sandbox_runtime.outputs.source }}
          TARGET_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags <<< "$TARGET_TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            if [[ -n "$tag" ]]; then
              tag_args+=(--tag "$tag")
            fi
          done
          docker buildx imagetools create "${tag_args[@]}" "$SOURCE_IMAGE"
      - id: build
        if: matrix.name != 'sandbox-runtime' || steps.sandbox_runtime.outputs.reuse != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          sbom: true
          provenance: mode=max
      - name: Verify anonymous image access
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cocola-${{ matrix.name }}:${{ github.ref_name }}
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          for attempt in {1..12}; do
            if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
              echo "Verified anonymous pull access for $IMAGE"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Published image is not anonymously readable: $IMAGE. Set the GHCR package visibility to Public, then rerun the failed jobs."
          exit 1
      - name: Verify sandbox runtime
        if: matrix.name == 'sandbox-runtime'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cocola-sandbox-runtime:${{ github.ref_name }}
        run: |
          output="$(docker run --rm --platform linux/amd64 "$IMAGE" /opt/cocola/shim/entrypoint.sh --selfcheck)"
          echo "$output"
          SELF="$output" python3 - <<'PY'
          import json
          import os

          data = json.loads(os.environ["SELF"])
          required = ["node", "claude_cli", "claude_agent_sdk", "chromium", "make", "gh"]
          failed = [name for name in required if str(data.get(name, "")).startswith(("missing", "error:"))]
          if failed:
              raise SystemExit("sandbox runtime selfcheck failed: " + ", ".join(failed))
          if data.get("github_skill") is not True:
              raise SystemExit("sandbox runtime selfcheck failed: Cocola GitHub Skill is missing")
          PY

  promote-images:
    name: promote image / ${{ matrix.name }}
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        name:
          - gateway
          - admin-api
          - storage-probe
          - agent-runtime
          - llm-gateway
          - sandbox-manager
          - web
          - sandbox-runtime
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: aliases
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/cocola-${{ matrix.name }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Promote verified release image
        env:
          SOURCE_IMAGE: ghcr.io/${{ github.repository_owner }}/cocola-${{ matrix.name }}:${{ github.ref_name }}
          TARGET_TAGS: ${{ steps.aliases.outputs.tags }}
        run: |
          mapfile -t tags <<< "$TARGET_TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            if [[ -n "$tag" ]]; then
              tag_args+=(--tag "$tag")
            fi
          done
          if [[ ${#tag_args[@]} -eq 0 ]]; then
            echo "::error::No release aliases were generated for ${SOURCE_IMAGE}"
            exit 1
          fi
          docker buildx imagetools create "${tag_args[@]}" "$SOURCE_IMAGE"

  cli:
    name: cli binaries
    needs: [promote-images, forgejo-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.24"
          cache-dependency-path: apps/cli/go.sum
      - name: Test CLI
        working-directory: apps/cli
        run: go test ./...
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
