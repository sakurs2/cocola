name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on the same PR — saves minutes when pushing rapidly.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-compatibility:
    name: docker compatibility / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            engine: "20.10.0"
            compose: "2.23.1"
          - name: current
            engine: "29.7.2"
            compose: "5.5.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: start Docker Engine ${{ matrix.engine }}
        run: |
          docker run --privileged --detach --name cocola-compatibility-dind \
            --publish 127.0.0.1:2375:2375 \
            --env DOCKER_TLS_CERTDIR= \
            "docker:${{ matrix.engine }}-dind"
          for attempt in {1..60}; do
            if DOCKER_HOST=tcp://127.0.0.1:2375 docker info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs cocola-compatibility-dind
          exit 1
      - name: install Docker Compose ${{ matrix.compose }}
        env:
          COMPOSE_VERSION: ${{ matrix.compose }}
        run: |
          plugin_dir="$RUNNER_TEMP/cocola-docker-config/cli-plugins"
          asset="docker-compose-linux-x86_64"
          mkdir -p "$plugin_dir"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 15 --max-time 120 \
            --output "$plugin_dir/$asset" \
            "https://github.com/docker/compose/releases/download/v$COMPOSE_VERSION/$asset"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 15 --max-time 120 \
            --output "$plugin_dir/$asset.sha256" \
            "https://github.com/docker/compose/releases/download/v$COMPOSE_VERSION/$asset.sha256"
          (cd "$plugin_dir" && sha256sum --check "$asset.sha256")
          mv "$plugin_dir/$asset" "$plugin_dir/docker-compose"
          chmod +x "$plugin_dir/docker-compose"
          printf 'DOCKER_CONFIG=%s\n' "$RUNNER_TEMP/cocola-docker-config" >> "$GITHUB_ENV"
      - name: verify Compose deployment semantics
        env:
          COCOLA_EXPECT_DOCKER_VERSION: ${{ matrix.engine }}
          COCOLA_EXPECT_COMPOSE_VERSION: ${{ matrix.compose }}
          DOCKER_HOST: tcp://127.0.0.1:2375
        run: scripts/verify-docker-compatibility.sh
      - name: clean up Docker Engine
        if: always()
        run: docker rm --force cocola-compatibility-dind || true

  # ------------------------------------------------------------------ proto
  proto:
    name: proto / buf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          version: "1.72.0"
          setup_only: true
      - name: buf lint
        working-directory: packages/proto
        run: buf lint
      - name: checkout base schema
        if: github.event_name == 'pull_request'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .buf-base
      - name: buf breaking
        if: github.event_name == 'pull_request'
        working-directory: packages/proto
        run: buf breaking --against "../../.buf-base/packages/proto"

  # ------------------------------------------------------------------ go
  go:
    name: go / build + test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache-dependency-path: |
            apps/admin-api/go.sum
            apps/cli/go.sum
            apps/gateway/go.sum
            packages/go-common/go.sum
            packages/proto/gen/go/go.sum
      - name: gofmt
        run: make go-format-check
      - name: go build (standalone services)
        run: |
          for app in admin-api gateway; do
            (cd "apps/$app" && GOWORK=off go build -o "/tmp/cocola-$app" "./cmd/$app")
          done
      - name: go vet (workspace)
        run: go vet ./apps/admin-api/... ./apps/gateway/... ./apps/cli/... ./db/... ./packages/go-common/... ./packages/proto/gen/go/...
      - name: go test (workspace)
        run: go test ./apps/admin-api/... ./apps/gateway/... ./apps/cli/... ./db/... ./packages/go-common/... ./packages/proto/gen/go/...
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: golangci-lint
        run: |
          baseline="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$baseline" || "$baseline" =~ ^0+$ ]]; then
            baseline="HEAD~1"
          fi
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m \
            --new-from-rev="$baseline" \
            ./apps/admin-api/... ./apps/gateway/... ./apps/cli/... ./db/... \
            ./packages/go-common/... ./packages/proto/gen/go/...

  sandbox-go:
    name: go / sandbox-manager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: apps/sandbox-manager/go.sum
      - name: go vet
        working-directory: apps/sandbox-manager
        run: GOWORK=off go vet ./...
      - name: go test
        working-directory: apps/sandbox-manager
        run: GOWORK=off go test ./...

  # ------------------------------------------------------------------ python
  python:
    name: python / ruff + pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [agent-runtime, llm-gateway]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.7.6"
      - name: install deps
        working-directory: apps/${{ matrix.app }}
        run: uv sync --all-extras --locked
      - name: ruff format
        working-directory: apps/${{ matrix.app }}
        run: |
          uv run ruff format --check . ../../packages/py-common
          if [[ "${{ matrix.app }}" == "agent-runtime" ]]; then
            uv run ruff format --check ../../deploy/sandbox-runtime/cocola_knowledge.py
          fi
      - name: ruff check
        working-directory: apps/${{ matrix.app }}
        run: |
          uv run ruff check . ../../packages/py-common
          if [[ "${{ matrix.app }}" == "agent-runtime" ]]; then
            uv run ruff check ../../deploy/sandbox-runtime/cocola_knowledge.py
          fi
      - name: ruff scripts
        if: matrix.app == 'agent-runtime'
        working-directory: apps/${{ matrix.app }}
        run: uv run ruff format --check ../../scripts && uv run ruff check ../../scripts
      - name: pytest
        working-directory: apps/${{ matrix.app }}
        run: uv run pytest -q
      - name: pytest release scripts
        if: matrix.app == 'agent-runtime'
        run: uv run --project apps/agent-runtime python -m pytest -q scripts/tests

  # ------------------------------------------------------------------ web
  web:
    name: web / format + lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make web-format-check
      - run: pnpm --filter @cocola/web lint
      - run: node --test apps/web/lib/*.test.mjs
      - run: pnpm --filter @cocola/web build
